<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="events.css">
    <title>JavaScript Events</title>
</head>
<body class="light">
    <div class="header">
        <h3>Header</h3>
        <h3 id="mouse-coords"></h3>
        <div id="switch-background"></div>
        <!--<img src="moon.png" id="switch-background"/>-->
    </div>
    <h1>JavaScript Events</h1>

    <details>
        <summary>Картинки и цветы</summary>
        <div class="images-and-colors">
            <div class="load-image">
                <div class="image-container">
                    <img alt="Фото студента" id="image">
                </div>
                <input type="file" id="image-file" onchange="setImage()">
                <div class="debug"></div>
            </div>

            <div class="colors">
                <div>
                    <label for="transition-time">Длительность перехода:</label>
                    <input type="range" id="transition-time"
                           min="0" max="5" step="0.1" value="3"
                           oninput="setTransitionTime(event)" />
                    <span id="transition-time-value">3 c</span>
                </div>
                <div>
                    <label for="background-color">Выберите цвет фона:</label>
                    <input type="color" id="background-color" oninput="setColor(event)" />
                    <!--<input type="color" id="background-color" oninput="setBackgroundColor()"/>-->
                </div>
                <div>
                    <label for="foreground-color">Выберите цвет текста:</label>
                    <input type="color" id="foreground-color" oninput="setColor(event)" />
                    <!--<input type="color" id="foreground-color" oninput="setForegroundColor(event)"/>-->
                </div>
            </div>
        </div>
    </details>

    <h2 id="full-time"></h2>

    <details>
        <summary>Clock</summary>
        <div id="clock">
            <div id="current-time">
                <span id="hours"></span>.
                <span id="minutes"></span>.
                <span id="seconds"></span>
            </div>
            <div id="current-date">
                <span id="years"></span>.
                <span id="months"></span>.
                <span id="days"></span>
            </div>
            <div id="day-of-week"></div>
            <div id="clock-controls">
                <input type="checkbox" id="show-date"><label for="show-date">Показать дату</label>
                <input type="checkbox" id="show-weekday"><label for="show-weekday">Показать день недели</label>
            </div>
        </div>
    </details>

    <div id="countdown-timer">
        <h2>Countdown timer</h2>
        <input type="date" id="target-date" value="2026-08-01" />
        <input type="time" id="target-time" value="22:00" />
        <input type="button" id="btn-start" value="Start" />
    </div>
    <div id="debug">
        <label for="target-date-value">Target date:</label><div id="target-date-value"></div><br />
        <label for="target-time-value">Target time:</label><div id="target-time-value"></div><br />
        <label for="timezone">Timezone:</label><div id="timezone"></div><br />
        <label for="duration">Duration:</label><div id="duration"></div><br />
        <label for="timestamp">Timestamp:</label><div id="timestamp"></div><br />
    </div>
    <div id="display">
        <div class="time-block">
            <div id="hours-unit" class="time-unit"></div>
            <div id="hours-marker" class="time-marker">Hours</div>
        </div>
        <div class="time-block">
            <div id="minutes-unit" class="time-unit"></div>
            <div id="minutes-marker" class="time-marker">Minutes</div>
        </div>
        <div class="time-block">
            <div id="seconds-unit" class="time-unit"></div>
            <div id="seconds-marker" class="time-marker">Seconds</div>
        </div>

    </div>

    <script src="events.js">

    </script>
</body>
</html>
